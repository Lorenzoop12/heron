name: CI

on:
  push:
    branches: ["lab-*"]
  pull_request:

permissions:
    contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked # checks dependencies coherency between pyproject.toml and uv.lock
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run : uv run mypy src
      - name: Docs
        run: uv run sphinx-build -W docs docs/_docs

test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
        - uses: actions/checkout@v7
        - uses: astral-sh/setup-uv@v9.0.0
          with:
            python-version: ${{ matrix.python-version }}
        - run: uv sync --locked
        - name: Tests with coverage
          run: uv run pytest --cov