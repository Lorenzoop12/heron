[project]
name = "heron"
version = "0.4.0"
description = "Phishing email triage: parse .eml files, extract indicators, produce a verdict"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"  # SPDX expression (PEP 639)
dependencies = ["rapidfuzz>=3.14"]  # the edit distance of levenshtein(); extras: [api], [ai]

[project.scripts]
heron = "heron.cli:main"

[dependency-groups]  # developer tools: never published; `uv sync` installs them
dev = [
  "ruff",
  "mypy",
  "pre-commit",
  "sphinx",
  "sphinx-rtd-theme",
  "pytest",
  "pytest-cov",
  "hypothesis",
  "diff-cover>=11.0.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heron"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "S"]  # S = security rules (bandit)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S101"]  # pytest uses plain assert

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["heron"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.mutmut]  # mutation testing: `uv add --dev mutmut`, then `uv run mutmut run`
source_paths = ["src/"]
also_copy = ["data/"]  # the CLI tests read data/samples
